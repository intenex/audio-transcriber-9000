name: AudioTranscriber9000
options:
  bundleIdPrefix: com.audiotranscriber9000
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: Z6FHNWFTWR
    CODE_SIGN_STYLE: Automatic

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.12.4

targets:
  AudioTranscriber9000:
    type: application
    platform: macOS
    sources:
      # Shared code + Mac-only UI; the other platform's UI and plists are
      # excluded (a stray Info-iOS.plist would be bundled as a resource).
      - path: AudioTranscriber
        excludes:
          - "App/iOS/**"
          - "Views/iOS/**"
          - "Info*.plist"
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: "Audio Transcriber 9000"
        PRODUCT_MODULE_NAME: AudioTranscriber
        PRODUCT_BUNDLE_IDENTIFIER: com.audiortranscriber.AudioTranscriber
        INFOPLIST_FILE: AudioTranscriber/Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioTranscriber/AudioTranscriber.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AudioTranscriber/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Audio Transcriber 9000 needs microphone access to record audio for transcription."
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: "Audio Transcriber 9000"
        NSUbiquitousContainers:
          iCloud.com.audiortranscriber.AudioTranscriber:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "Audio Transcriber"
            NSUbiquitousContainerSupportedFolderLevels: Any

  AudioTranscriber9000iOS:
    type: application
    platform: iOS
    sources:
      - path: AudioTranscriber
        excludes:
          - "App/Mac/**"
          - "Views/Mac/**"
          - "Info*.plist"
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: "Audio Transcriber 9000"
        PRODUCT_MODULE_NAME: AudioTranscriber
        PRODUCT_BUNDLE_IDENTIFIER: com.audiortranscriber.AudioTranscriber.ios
        INFOPLIST_FILE: AudioTranscriber/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: AudioTranscriber/AudioTranscriber-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: AudioTranscriber/Info-iOS.plist
      properties:
        NSMicrophoneUsageDescription: "Audio Transcriber 9000 needs microphone access to record audio for transcription."
        CFBundleDisplayName: "AT-9000"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.com.audiortranscriber.AudioTranscriber:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "Audio Transcriber"
            NSUbiquitousContainerSupportedFolderLevels: Any

  AudioTranscriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AudioTranscriberTests
    dependencies:
      - target: AudioTranscriber9000
    settings:
      base:
        PRODUCT_NAME: AudioTranscriberTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Audio Transcriber 9000.app/Contents/MacOS/Audio Transcriber 9000"

  AudioTranscriberTestsiOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      # The SAME test sources as the Mac target — everything that isn't
      # #if os(macOS)-guarded runs on the simulator too.
      - Tests/AudioTranscriberTests
    dependencies:
      - target: AudioTranscriber9000iOS
    settings:
      base:
        PRODUCT_NAME: AudioTranscriberTestsiOS
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Audio Transcriber 9000.app/Audio Transcriber 9000"

schemes:
  AudioTranscriber9000:
    build:
      targets:
        AudioTranscriber9000: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AudioTranscriberTests
  AudioTranscriber9000iOS:
    build:
      targets:
        AudioTranscriber9000iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AudioTranscriberTestsiOS
